<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1020" />
    <title>Beast Breaker</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0c1020; overflow: hidden; }
      #game { width: 100vw; height: 100dvh; }
      canvas { touch-action: none; image-rendering: pixelated; }
      #error-overlay {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: rgba(12, 16, 32, 0.94); color: #f8f8f8;
        font-family: "Press Start 2P", monospace; font-size: 10px; line-height: 1.8;
        align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
      }
      #error-overlay .box { max-width: 420px; width: 100%; background: #f8f8f8; color: #283048;
        border: 4px solid #283048; outline: 2px solid #f8f8f8; padding: 16px; }
      #error-overlay pre { white-space: pre-wrap; word-break: break-word; font-size: 8px;
        background: #e0e4ee; padding: 8px; max-height: 30vh; overflow: auto; }
      #error-overlay button { font: inherit; margin: 8px 8px 0 0; padding: 8px 10px; cursor: pointer;
        background: #283048; color: #f8f8f8; border: 0; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="error-overlay" role="alertdialog" aria-live="assertive"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
